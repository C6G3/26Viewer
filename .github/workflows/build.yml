name: build

# Every push to main and every pull request is built and tested. Pushing a tag
# such as v0.3.0 does the same and then publishes the packaged app as a
# GitHub Release (see docs/BUILDING.md, "Making a release").
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-catch

      # A release tag must match project(VERSION) in CMakeLists.txt, so the
      # version shown in Help > About is the one on the release.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in CMakeLists.txt"
            exit 1
          fi

      # Presets hard-code C:/msys64; CI's MSYS2 lives elsewhere, so configure directly.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=dist

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --install build

      - uses: actions/upload-artifact@v4
        with:
          name: 26Viewer-windows
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-mingw
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload the zip
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 26Viewer-windows
          path: 26Viewer

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path 26Viewer -DestinationPath "26Viewer-$env:GITHUB_REF_NAME-windows-x64.zip"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME" "26Viewer-$env:GITHUB_REF_NAME-windows-x64.zip"
          --repo "$env:GITHUB_REPOSITORY" --title "26Viewer $env:GITHUB_REF_NAME" --generate-notes
